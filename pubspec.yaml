name: guitar_theory_app
description: A new Flutter project for Guitar & Theory Explorer.
publish_to: 'none'
version: 1.1.3+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # UI & Assets
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  
  # Routing
  go_router: ^17.0.1
  url_launcher: ^6.3.1

  # Logic & Data
  collection: ^1.19.1
  tonic: ^0.2.5
  web: ^1.1.1
  
  # Audio
  flutter_soloud: ^3.5.4
  sound_stream: ^0.3.0
  
  # Desktop
  window_manager: ^0.4.3
  
  # AI
  google_generative_ai: ^0.4.7
  flutter_markdown_plus: ^1.0.12
  shared_preferences: ^2.5.2
  path_provider: ^2.1.5
  speech_to_text: ^7.3.0
  permission_handler: ^11.3.1
  dart_openai: ^6.1.1

  http: ^1.3.0        # API 통신
  web_socket_channel: ^3.0.3
  audioplayers: ^6.1.2 # 오디오 재생

  flutter_markdown: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.ico"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  
  assets:
    - assets/fonts/
    - assets/sounds/
    - assets/images/
    - README.md
