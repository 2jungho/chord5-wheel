<!DOCTYPE html>
<html>
  <head>
    <base href="/" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="A new Flutter project." />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Fix for deprecation warning -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="guitar_theory_app" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <title>Chord Progression Studio</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Add Tone.js for Web Audio -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"
      crossorigin="anonymous"
    ></script>
    <!-- Cache control for PWA updates -->
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
  </head>
  <body>
    <!-- Dynamically load flutter.js with cache busting -->
    <!-- Flutter bootstrap -->
    <script>
      console.log("Web Audio Engine Initializing - v9 (Reliable Audio & Fallback)");

      let sampler;
      let fallbackSynth;
      let isLoaded = false;
      let currentInstrument = "guitar_std";

      // Fallback Synth so audio always works immediately
      try {
        fallbackSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: "triangle" },
          envelope: { attack: 0.005, decay: 0.3, sustain: 0.3, release: 0.8 },
        });
      } catch (e) {
        console.warn("Could not init fallback synth:", e);
      }


      window.setWebVolume = function (vol) {
        try {
          const clamped = Math.max(0.0, Math.min(1.0, vol));
          if (clamped <= 0.001) {
            Tone.Destination.mute = true;
          } else {
            Tone.Destination.mute = false;
            // Map 0.01..1.0 to -40dB..+3dB
            const db = 20 * Math.log10(clamped);
            Tone.Destination.volume.value = Math.max(-40, db);
          }
        } catch (e) {
          console.warn("setWebVolume error:", e);
        }
      };

      window.setWebInstrument = function (id) {
        currentInstrument = id;
      };

      // Master Audio Processing Graph & Studio Effects
      let masterLimiter, masterCompressor, studioReverb, studioChorus;
      let nylonSynth, electricCleanSynth, electricCrunchSynth;
      let drumKick, drumSnareBody, drumSnareNoise, snareFilter, drumHiHat, drumRim;
      let bassSynth, keysSynth;

      let currentProfiles = {
        drums: "drums_acoustic",
        bass: "bass_jazz",
        keys: "keys_rhodes",
        guitar: "guitar_acoustic",
      };

      try {
        masterLimiter = new Tone.Limiter(-0.3).toDestination();
        masterCompressor = new Tone.Compressor({
          threshold: -18,
          ratio: 3.2,
          attack: 0.02,
          release: 0.22,
        }).connect(masterLimiter);

        studioReverb = new Tone.Reverb({
          decay: 1.6,
          preDelay: 0.015,
          wet: 0.20,
        }).connect(masterCompressor);

        studioChorus = new Tone.Chorus({
          frequency: 1.8,
          delayTime: 3.5,
          depth: 0.55,
          wet: 0.35,
        }).connect(studioReverb);
        studioChorus.start();

        // 1. Steel-String Acoustic Guitar: Studio Recorded Samples
        sampler = new Tone.Sampler({
          urls: {
            E2: "assets/assets/sounds/E2.mp3",
            A2: "assets/assets/sounds/A2.mp3",
            D3: "assets/assets/sounds/D3.mp3",
            G3: "assets/assets/sounds/G3.mp3",
            B3: "assets/assets/sounds/B3.mp3",
            E4: "assets/assets/sounds/E4.mp3",
            A3: "assets/assets/sounds/A3.mp3",
            C3: "assets/assets/sounds/C3.mp3",
            E3: "assets/assets/sounds/E3.mp3",
            G2: "assets/assets/sounds/G2.mp3",
          },
          baseUrl: "./",
          onload: () => {
            console.log("Guitar samples mapping completed!");
            isLoaded = true;
          },
          onerror: (err) => {
            console.warn("Tone.Sampler failed to load some samples, using fallback:", err);
          },
        }).connect(masterCompressor);
        sampler.connect(studioReverb);

        // 2. Classical Nylon Guitar: Soft-attack warm Karplus-Strong physical modeling
        const nylonFilter = new Tone.Filter({ frequency: 3400, type: "lowpass" }).connect(masterCompressor);
        nylonFilter.connect(studioReverb);
        nylonSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: "triangle" },
          envelope: { attack: 0.02, decay: 1.1, sustain: 0.08, release: 0.9 },
        }).connect(nylonFilter);

        // 3. Electric Clean Guitar: Single-Coil pickup pulse wave + lush analog chorus
        const cleanCab = new Tone.Filter({ frequency: 6200, type: "lowpass" }).connect(masterCompressor);
        const cleanChorus = new Tone.Chorus({ frequency: 1.8, delayTime: 3.5, depth: 0.55, wet: 0.38 }).connect(cleanCab);
        cleanChorus.connect(studioReverb);
        cleanChorus.start();
        electricCleanSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: "pulse", width: 0.32 },
          envelope: { attack: 0.003, decay: 0.9, sustain: 0.28, release: 0.75 },
        }).connect(cleanChorus);

        // 4. Crunch Overdrive Electric Guitar: Sawtooth + Tube Preamp Drive + 4x12 Speaker Cabinet Simulation
        const crunchCab = new Tone.Filter({ frequency: 3200, type: "lowpass", rolloff: -24 }).connect(masterCompressor);
        crunchCab.connect(studioReverb);
        const crunchDrive = new Tone.Distortion({ distortion: 0.40, oversample: "4x", wet: 0.85 }).connect(crunchCab);
        electricCrunchSynth = new Tone.PolySynth(Tone.Synth, {
          oscillator: { type: "sawtooth" },
          envelope: { attack: 0.004, decay: 1.3, sustain: 0.60, release: 0.9 },
        }).connect(crunchDrive);




        // 1. Studio Punch Kick (Sub 40Hz with 120Hz transient click & soft tape saturation)
        drumKick = new Tone.MembraneSynth({
          pitchDecay: 0.035,
          octaves: 5.5,
          oscillator: { type: "sine" },
          envelope: { attack: 0.002, decay: 0.32, sustain: 0.01, release: 0.32 },
        }).connect(masterCompressor);

        // 2. Realistic Dual-layer Snare (Acoustic 190Hz wood body + High-cut wire sizzle)
        drumSnareBody = new Tone.MembraneSynth({
          pitchDecay: 0.015,
          octaves: 2.2,
          oscillator: { type: "triangle" },
          envelope: { attack: 0.001, decay: 0.14, sustain: 0.0, release: 0.14 },
        }).connect(masterCompressor);

        snareFilter = new Tone.Filter({ frequency: 4800, type: "lowpass" }).connect(masterCompressor);
        snareFilter.connect(studioReverb);
        drumSnareNoise = new Tone.NoiseSynth({
          noise: { type: "pink" },
          envelope: { attack: 0.002, decay: 0.18, sustain: 0.0, release: 0.18 },
        }).connect(snareFilter);

        // 3. Crisp Hi-Hat / Cymbal with bandpass acoustic tone
        const hihatFilter = new Tone.Filter({ frequency: 6500, type: "highpass" }).connect(masterCompressor);
        hihatFilter.connect(studioReverb);
        drumHiHat = new Tone.MetalSynth({
          frequency: 240,
          envelope: { attack: 0.001, decay: 0.05, release: 0.05 },
          harmonicity: 4.8,
          modulationIndex: 28,
          resonance: 3800,
          octaves: 1.2,
        }).connect(hihatFilter);

        // 4. Snappy Cross-stick Rimshot
        drumRim = new Tone.MembraneSynth({
          pitchDecay: 0.008,
          octaves: 1.8,
          oscillator: { type: "sine" },
          envelope: { attack: 0.001, decay: 0.06, sustain: 0.0, release: 0.06 },
        }).connect(masterCompressor);
        drumRim.connect(studioReverb);

        // 5. Warm Vintage P-Bass / Jazz Bass (Analog sub-lowpass + subtle tube saturation)
        bassSynth = new Tone.MonoSynth({
          oscillator: { type: "triangle" },
          filter: { Q: 1.8, type: "lowpass", rolloff: -24 },
          filterEnvelope: {
            attack: 0.008,
            decay: 0.25,
            sustain: 0.35,
            release: 0.45,
            baseFrequency: 45,
            octaves: 2.2,
          },
          envelope: { attack: 0.008, decay: 0.35, sustain: 0.6, release: 0.5 },
        }).connect(masterCompressor);

        // 6. Lush Fender Rhodes / E.Piano (FM Bell chime + stereo chorus + reverb)
        keysSynth = new Tone.PolySynth(Tone.FMSynth, {
          harmonicity: 2.0,
          modulationIndex: 1.3,
          oscillator: { type: "sine" },
          envelope: { attack: 0.012, decay: 0.9, sustain: 0.45, release: 1.4 },
          modulation: { type: "triangle" },
          modulationEnvelope: { attack: 0.008, decay: 0.45, sustain: 0.15, release: 0.9 },
        }).connect(studioChorus);
      } catch (e) {
        console.warn("Could not init backing band synths:", e);
      }

      window.setWebSoundProfile = function (category, profileId) {
        if (!category || !profileId) return;
        currentProfiles[category] = profileId;

        try {
          if (category === "drums") {
            if (profileId === "drums_lofi") {
              if (drumKick) { drumKick.pitchDecay = 0.05; drumKick.octaves = 4.0; }
              if (snareFilter) { snareFilter.frequency.value = 3000; }
            } else if (profileId === "drums_brush") {
              if (drumKick) { drumKick.pitchDecay = 0.022; drumKick.octaves = 3.2; }
              if (snareFilter) { snareFilter.frequency.value = 2400; }
            } else if (profileId === "drums_electronic") {
              if (drumKick) { drumKick.pitchDecay = 0.045; drumKick.octaves = 7.0; }
              if (snareFilter) { snareFilter.frequency.value = 6500; }
            } else {
              // drums_acoustic
              if (drumKick) { drumKick.pitchDecay = 0.035; drumKick.octaves = 5.5; }
              if (snareFilter) { snareFilter.frequency.value = 4800; }
            }
          } else if (category === "bass") {
            if (profileId === "bass_slap" && bassSynth) {
              bassSynth.set({
                oscillator: { type: "sawtooth" },
                filter: { Q: 3.2, type: "lowpass" },
                filterEnvelope: { baseFrequency: 65, octaves: 3.2, attack: 0.005, decay: 0.16 }
              });
            } else if (profileId === "bass_upright" && bassSynth) {
              bassSynth.set({
                oscillator: { type: "sine" },
                filter: { Q: 1.2, type: "lowpass" },
                filterEnvelope: { baseFrequency: 38, octaves: 1.6, attack: 0.02, decay: 0.42 }
              });
            } else if (profileId === "bass_synth" && bassSynth) {
              bassSynth.set({
                oscillator: { type: "sawtooth8" },
                filter: { Q: 4.2, type: "lowpass" },
                filterEnvelope: { baseFrequency: 55, octaves: 4.0, attack: 0.005, decay: 0.28 }
              });
            } else if (bassSynth) {
              // bass_jazz
              bassSynth.set({
                oscillator: { type: "triangle" },
                filter: { Q: 1.8, type: "lowpass" },
                filterEnvelope: { baseFrequency: 45, octaves: 2.2, attack: 0.008, decay: 0.25 }
              });
            }
          } else if (category === "keys") {
            if (profileId === "keys_piano" && keysSynth) {
              keysSynth.set({
                harmonicity: 1.0,
                modulationIndex: 0.4,
                oscillator: { type: "triangle" },
                envelope: { attack: 0.005, decay: 0.8, sustain: 0.2, release: 0.8 }
              });
            } else if (profileId === "keys_organ" && keysSynth) {
              keysSynth.set({
                harmonicity: 3.0,
                modulationIndex: 2.2,
                oscillator: { type: "sine" },
                envelope: { attack: 0.01, decay: 1.2, sustain: 0.8, release: 0.5 }
              });
            } else if (profileId === "keys_pad" && keysSynth) {
              keysSynth.set({
                harmonicity: 1.5,
                modulationIndex: 1.8,
                oscillator: { type: "sawtooth" },
                envelope: { attack: 0.12, decay: 1.5, sustain: 0.7, release: 2.0 }
              });
            } else if (keysSynth) {
              // keys_rhodes
              keysSynth.set({
                harmonicity: 2.0,
                modulationIndex: 1.3,
                oscillator: { type: "sine" },
                envelope: { attack: 0.012, decay: 0.9, sustain: 0.45, release: 1.4 }
              });
            }
          } else if (category === "guitar") {
            console.log("Guitar sound profile set to:", profileId);
          }

        } catch (e) {
          console.warn("setWebSoundProfile error:", e);
        }
      };

      function getActiveGuitarSynth() {
        const prof = currentProfiles.guitar || "guitar_acoustic";
        if (prof === "guitar_nylon" && nylonSynth) {
          return nylonSynth;
        } else if (prof === "guitar_clean" && electricCleanSynth) {
          return electricCleanSynth;
        } else if (prof === "guitar_crunch" && electricCrunchSynth) {
          return electricCrunchSynth;
        }
        return (isLoaded && sampler) ? sampler : fallbackSynth;
      }

      window.playWebDrum = async function (type, volume) {
        try {
          if (Tone.context.state !== "running") await Tone.start();
          const vol = volume !== undefined ? Math.max(0.01, volume) : 0.8;
          const gainDb = Tone.gainToDb(vol);

          if (type === "kick" && drumKick) {
            drumKick.volume.value = gainDb;
            drumKick.triggerAttackRelease("C1", "8n");
          } else if (type === "snare") {
            if (drumSnareBody) {
              drumSnareBody.volume.value = Tone.gainToDb(vol * 0.85);
              drumSnareBody.triggerAttackRelease("G2", "16n");
            }
            if (drumSnareNoise) {
              drumSnareNoise.volume.value = Tone.gainToDb(vol * 0.9);
              drumSnareNoise.triggerAttackRelease("16n");
            }
          } else if (type === "hiHatClosed" && drumHiHat) {
            drumHiHat.volume.value = Tone.gainToDb(vol * 0.65);
            drumHiHat.envelope.decay = 0.045;
            drumHiHat.triggerAttackRelease("32n");
          } else if (type === "hiHatOpen" && drumHiHat) {
            drumHiHat.volume.value = Tone.gainToDb(vol * 0.75);
            drumHiHat.envelope.decay = 0.32;
            drumHiHat.triggerAttackRelease("8n");
          } else if (type === "rimshot" && drumRim) {
            drumRim.volume.value = Tone.gainToDb(vol * 0.8);
            drumRim.triggerAttackRelease("A3", "32n");
          }
        } catch (e) {
          console.warn("playWebDrum error:", e);
        }
      };

      window.playWebBass = async function (note, octave, volume) {
        try {
          if (Tone.context.state !== "running") await Tone.start();
          const pitch = (note || "C").replace("CSharp", "C#").replace("DSharp", "D#").replace("FSharp", "F#").replace("GSharp", "G#").replace("ASharp", "A#") + (octave || 2);
          if (bassSynth) {
            const vol = volume !== undefined ? Math.max(0.01, volume) : 0.75;
            bassSynth.volume.value = Tone.gainToDb(vol);
            bassSynth.triggerAttackRelease(pitch, "4n");
          }
        } catch (e) {
          console.warn("playWebBass error:", e);
        }
      };

      window.playWebKeys = async function (note, octave, volume) {
        try {
          if (Tone.context.state !== "running") await Tone.start();
          const pitch = (note || "C").replace("CSharp", "C#").replace("DSharp", "D#").replace("FSharp", "F#").replace("GSharp", "G#").replace("ASharp", "A#") + (octave || 3);
          if (keysSynth) {
            const vol = volume !== undefined ? Math.max(0.01, volume) : 0.65;
            keysSynth.volume.value = Tone.gainToDb(vol);
            keysSynth.triggerAttackRelease(pitch, "2n");
          }
        } catch (e) {
          console.warn("playWebKeys error:", e);
        }
      };

      window.playWebGuitarNote = async function (note, octave) {
        try {
          if (Tone.context.state !== "running") {
            await Tone.start();
            if (Tone.context.resume) {
              await Tone.context.resume();
            }
          }

          // Normalize note string (e.g. CSharp -> C#)
          let cleanNote = note
            .replace("CSharp", "C#")
            .replace("DSharp", "D#")
            .replace("FSharp", "F#")
            .replace("GSharp", "G#")
            .replace("ASharp", "A#");

          let targetOctave = octave;
          if (currentInstrument && currentInstrument.includes("bass")) {
            targetOctave -= 1;
          }

          const pitch = cleanNote + targetOctave;
          const guitarSynth = getActiveGuitarSynth();
          if (guitarSynth) {
            guitarSynth.triggerAttackRelease(pitch, "2n");
          }
        } catch (e) {
          console.warn("playWebGuitarNote error:", e);
        }
      };

      window.scheduleWebSequence = async function (bpm, dataJson) {
        await Tone.start();
        Tone.Transport.stop();
        Tone.Transport.cancel();
        Tone.Transport.bpm.value = bpm;

        const data = JSON.parse(dataJson);
        const progression = data.progression;
        const rhythm = data.rhythm;

        let currentBeat = 0; // Cumulative beats
        const activeGuitar = getActiveGuitarSynth();

        progression.forEach((block) => {
          const notes = block.chordDetail ? block.chordDetail.notes : [];
          if (notes.length === 0) {
            currentBeat += block.duration;
            return;
          }

          const barsInBlock = block.duration / 4;
          for (let b = 0; b < barsInBlock; b++) {
            const barStartBeat = currentBeat + b * 4;

            rhythm.steps.forEach((step) => {
              // pos 0-15 mapped to a 4-beat bar
              // 1 step = 0.25 beats (16th note)
              const offsetBeats = step.pos * 0.25;
              const absoluteBeat = barStartBeat + offsetBeats;

              // Use Tone.Time to convert beats to seconds accurately
              const startTime = Tone.Time(absoluteBeat, "n").toSeconds();

              Tone.Transport.schedule((time) => {
                const velocity = step.accent ? 0.85 : 0.55;

                if (step.type === "down" || step.type === "up") {
                  notes.forEach((note, i) => {
                    const strumDelay =
                      step.type === "down"
                        ? i * 0.02
                        : (notes.length - 1 - i) * 0.015;
                    if (activeGuitar) {
                      activeGuitar.triggerAttackRelease(
                        note + "3",
                        "4n",
                        time + strumDelay,
                        velocity
                      );
                    }
                  });
                } else if (step.type === "bass") {
                  if (activeGuitar) {
                    activeGuitar.triggerAttackRelease(
                      notes[0] + "2",
                      "4n",
                      time,
                      velocity + 0.1
                    );
                  }
                } else if (step.type === "mute") {
                  notes.forEach((note, i) => {
                    if (activeGuitar) {
                      activeGuitar.triggerAttackRelease(
                        note + "3",
                        "16n",
                        time + i * 0.01,
                        velocity * 0.4
                      );
                    }
                  });
                }
              }, startTime);
            });
          }
          currentBeat += block.duration;
        });

        // Loop the progression
        Tone.Transport.loop = true;
        Tone.Transport.loopEnd = currentBeat + "n";
        Tone.Transport.start();
      };


      window.stopWebAudio = function () {
        Tone.Transport.stop();
        Tone.Transport.cancel();
      };

      window.setWebBPM = function (bpm) {
        Tone.Transport.bpm.value = bpm;
      };

      // --- 4. Audio Jam Recorder (Mic Capture & Quick Sketch) ---
      let mediaRecorder;
      let recordedChunks = [];
      let recordedAudioBlob = null;

      window.startWebRecording = async function () {
        try {
          recordedChunks = [];
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = function (e) {
            if (e.data.size > 0) recordedChunks.push(e.data);
          };
          mediaRecorder.onstop = function () {
            recordedAudioBlob = new Blob(recordedChunks, { type: "audio/webm" });
            console.log("Web Recording completed. Blob size:", recordedAudioBlob.size);
          };
          mediaRecorder.start();
          return true;
        } catch (err) {
          console.warn("startWebRecording error:", err);
          return false;
        }
      };

      window.stopWebRecording = function () {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          mediaRecorder.stop();
          if (mediaRecorder.stream) {
            mediaRecorder.stream.getTracks().forEach((track) => track.stop());
          }
          return true;
        }
        return false;
      };

      window.downloadWebRecording = function (filename) {
        if (!recordedAudioBlob) {
          console.warn("No recorded audio blob available");
          return false;
        }
        const url = URL.createObjectURL(recordedAudioBlob);
        const a = document.createElement("a");
        a.style.display = "none";
        a.href = url;
        a.download = filename || "guitar_jam_sketch.webm";
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          window.URL.revokeObjectURL(url);
        }, 100);
        return true;
      };
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
